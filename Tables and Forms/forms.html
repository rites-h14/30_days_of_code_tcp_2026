<!DOCTYPE html>
<style>
#main-header{
    width: 100%;
    text-align: center;
    font-size: 2rem;
    font-family: 'Arial', sans-serif;
    padding: 1rem;
    background-color: #0056b3;
    color: white;
    border-radius: 10px;
    margin-bottom: 20px;

<header id="main-header">You are most Welcome!</header>
<form method="POST">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>
    <label for="Contact">Contact:</label>
    <input type="tel" id="Contact" name="Contact" maxlength="10"><br><br>
    <h3>Choose your Participation Type:</h3>
    <label for="radio">Solo:</label>
    <input type="radio" id="radio" name="radio"><br><br>
     <label for="radio">Duo:</label>
    <input type="radio" id="radio" name="radio"><br><br>
     <label for="radio">Team:</label>
    <input type="radio" id="radio" name="radio"><br><br>
    <h3>Event Preferences:</h3>
    <label for="checkbox">Complete</label>
    <input type="checkbox" id="checkbox" name="checkbox"><br><br>
    <label for="checkbox">Only Night:</label>
    <input type="checkbox" id="checkbox" name="checkbox"><br><br>
    <label for="checkbox">Only Day:</label>
    <input type="checkbox" id="checkbox" name="checkbox"><br><br>
    <label for="text">Any Query?:</label>
    <textarea id="message" name="text" rows="4" cols="50"></textarea><br><br>
    <input type="submit" value="Submit">
</form>
