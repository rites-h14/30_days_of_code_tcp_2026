<!-- This file contains SVG vector graphics used in the game, such as icons for X and O symbols, enhancing the visual quality of the game. -->

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <symbol id="icon-x" viewBox="0 0 24 24">
    <line x1="4" y1="4" x2="20" y2="20" stroke="black" stroke-width="2"/>
    <line x1="20" y1="4" x2="4" y2="20" stroke="black" stroke-width="2"/>
  </symbol>
  <symbol id="icon-o" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="black" stroke-width="2" fill="none"/>
  </symbol>
</svg>